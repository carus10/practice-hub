<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pratik Hub - Klavye Pratiği</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ['Lora', 'serif'],
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              paper: 'var(--surface)',
              ink: 'var(--text-primary)',
              faint: 'var(--text-muted)',
              accent: 'var(--accent)',
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --surface: #f7f5f0;
        --bg-primary: #faf9f6;
        --bg-card: #ffffff;
        --text-primary: #2d3748;
        --text-muted: #a8a29e;
        --accent: #c05621;
        --dot-color: #d6d3d1;
      }
      .dark {
        --surface: #111111;
        --bg-primary: #0a0a0a;
        --bg-card: #1a1a1a;
        --text-primary: #e8e6e3;
        --text-muted: #6b7280;
        --accent: #e07c3a;
        --dot-color: #1a1a1a;
      }
      body {
        background-color: var(--surface);
        color: var(--text-primary);
      }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      @keyframes pureFadeIn { from { opacity: 0; } to { opacity: 1; } }
      .page-transition { animation: pureFadeIn 0.6s ease-out forwards; }

      /* === DARK MODE OVERRIDES === */
      .dark .bg-white { background-color: var(--bg-card); }
      .dark .bg-white\/70,.dark .bg-white\/80,.dark .bg-white\/90,.dark .bg-white\/50,.dark .bg-white\/40 { background-color: rgba(26,26,26,0.85); }
      .dark .bg-stone-50 { background-color: #151515; }
      .dark .bg-stone-100 { background-color: #1e1e1e; }
      .dark .bg-stone-200 { background-color: #252525; }
      .dark .bg-\[\#faf9f6\] { background-color: var(--bg-primary); }
      .dark .border-stone-100 { border-color: #1f1f1f; }
      .dark .border-stone-200 { border-color: #2a2a2a; }
      .dark .border-stone-200\/70,.dark .border-stone-200\/60,.dark .border-stone-200\/80 { border-color: rgba(42,42,42,0.7); }
      .dark .border-stone-300 { border-color: #333; }
      .dark .border-white { border-color: #2a2a2a; }
      .dark .text-stone-300 { color: #9ca3af; }
      .dark .text-stone-400 { color: #6b7280; }
      .dark .text-stone-500 { color: #9ca3af; }
      .dark .text-stone-600 { color: #d1d5db; }
      .dark .text-stone-700 { color: #e5e7eb; }
      .dark .text-stone-800 { color: #f3f4f6; }
      .dark .text-stone-900 { color: #f9fafb; }
      .dark .bg-stone-900\/40 { background-color: rgba(0,0,0,0.65); }
      .dark .bg-stone-900\/20 { background-color: rgba(0,0,0,0.45); }
      .dark input:not([type="range"]):not([type="checkbox"]):not([type="file"]),
      .dark textarea, .dark select {
        background-color: #1e1e1e !important;
        color: var(--text-primary) !important;
        border-color: #333 !important;
      }
      .dark input:focus, .dark textarea:focus { border-color: #555 !important; }
      .dark ::placeholder { color: #555 !important; }
      .dark ::selection { background-color: rgba(255,255,255,0.15); color: #fff; }
      .dark input[type="range"] { accent-color: #e8e6e3; }
      .dark .bg-emerald-50 { background-color: rgba(16,185,129,0.1); }
      .dark .bg-blue-50 { background-color: rgba(59,130,246,0.1); }
      .dark .bg-red-50 { background-color: rgba(239,68,68,0.1); }
      .dark .bg-amber-50 { background-color: rgba(245,158,11,0.1); }
      .dark .bg-violet-50 { background-color: rgba(139,92,246,0.1); }
      .dark .bg-orange-50\/80 { background-color: rgba(245,158,11,0.08); }
      .dark .bg-emerald-50\/80 { background-color: rgba(16,185,129,0.08); }
      .dark .bg-blue-50\/80 { background-color: rgba(59,130,246,0.08); }
      .dark .border-emerald-100,.dark .border-blue-100,.dark .border-orange-100 { border-color: rgba(255,255,255,0.08); }
      .dark .bg-emerald-100 { background-color: rgba(16,185,129,0.15); }
      .dark .bg-blue-100 { background-color: rgba(59,130,246,0.15); }
      .dark .bg-red-100 { background-color: rgba(239,68,68,0.15); }
      .dark .bg-amber-100 { background-color: rgba(245,158,11,0.15); }
      .dark .border-emerald-200,.dark .border-blue-200,.dark .border-amber-200,.dark .border-red-200,.dark .border-violet-200 { border-color: rgba(255,255,255,0.12); }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
